# Coasys fork release workflow for rusty_v8.
# Builds the V8 static library for all supported platforms and publishes
# them as GitHub release assets so that downstream consumers (e.g. ad4m)
# can download pre-built binaries instead of building V8 from source.
#
# Triggered by pushing a tag of the form: v<version>
# The tag MUST match the `version` field in Cargo.toml so that
# rusty_v8's build.rs can locate the correct release for download.
# e.g.:  git tag v137.1.0 && git push origin v137.1.0

name: coasys-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.config.target }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 300

    strategy:
      fail-fast: false
      matrix:
        config:
          # macOS runners bumped to macos-15 (Xcode 16 / SDK 15+) because V8 150
          # requires SDK 15+. Older macos-13/macos-14 images ship Xcode 15.4 with
          # only SDK 14.5, causing `find_sdk.py` to fail with:
          #   Exception: No 15+ SDK found.
          - os: macos-15
            target: x86_64-apple-darwin
            # sccache platform = what's running on the runner (host arch)

          - os: macos-15
            target: aarch64-apple-darwin

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
            # Runner is x86_64 ubuntu; sccache binary must match runner, not target

          - os: windows-2022
            target: x86_64-pc-windows-msvc

    env:
      V8_FROM_SOURCE: true
      LIB_NAME: ${{ contains(matrix.config.target, 'windows') && 'rusty_v8' || 'librusty_v8' }}
      LIB_EXT: ${{ contains(matrix.config.target, 'windows') && 'lib' || 'a' }}

    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Install Rust toolchain
        uses: dsherret/rust-toolchain-file@v1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.x
        # Note: no 'architecture: x64' — on macos-14 (ARM64) that would fail

      - name: Remove extra Python versions (Windows)
        if: contains(matrix.config.os, 'windows')
        shell: pwsh
        run: |
          $env:PATH -split ";" |
            Where-Object { Test-Path "$_\python.exe" } |
            Select-Object -Skip 1 |
            ForEach-Object { Move-Item "$_" "$_.disabled" }

      - name: Install cross-compilation toolchain (aarch64-linux)
        if: matrix.config.cross == true
        run: |
          rustup target add aarch64-unknown-linux-gnu

          sudo apt update
          sudo apt install -yq --no-install-suggests --no-install-recommends \
            binfmt-support g++-10-aarch64-linux-gnu g++-10-multilib \
            gcc-10-aarch64-linux-gnu libc6-arm64-cross

          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc-10" >> "${GITHUB_ENV}"

      - name: Install Clang (Linux)
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-jammy-19.list
          curl https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          sudo apt-get -qq remove 'clang-*'
          sudo apt-get install lld-19 clang-19 clang-tools-19 -y

      - name: Hide system LLVM so Chromium clang gets downloaded (macOS)
        # build.rs hardcodes /opt/homebrew/opt/llvm. Homebrew files are owned
        # by the runner user so no sudo needed.
        if: startsWith(matrix.config.os, 'macos')
        run: mv /opt/homebrew/opt/llvm /opt/homebrew/opt/llvm_disabled 2>/dev/null || true

      - name: Hide system LLVM so Chromium clang gets downloaded (Windows)
        # C:\LLVM clang 21 is missing clang_rt.builtins-x86_64.lib.
        # Rename the dir so find_compatible_system_clang() returns None.
        if: contains(matrix.config.os, 'windows')
        shell: pwsh
        run: |
          if (Test-Path "C:\LLVM") {
            Rename-Item "C:\LLVM" "C:\LLVM_disabled"
          }

      - name: Write git_submodule_status.txt
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |-
            target/sccache
            target/*/.*
            target/*/build
            target/*/deps
          key: coasys-release-${{ matrix.config.target }}-${{ hashFiles('Cargo.lock', 'build.rs', 'git_submodule_status.txt') }}
          restore-keys: coasys-release-${{ matrix.config.target }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4
        env:
          SCCACHE_CACHE_SIZE: 256M

      - name: Clear stale GN output after cache restore (macOS/Windows)
        # Cache restore (above) may have brought back GN output that was
        # generated with the old broken clang path. Clear it so clang_download()
        # in build.rs generates fresh GN files with the downloaded Chromium clang.
        if: startsWith(matrix.config.os, 'macos') || contains(matrix.config.os, 'windows')
        shell: bash
        run: rm -rf target/*/release/gn_out target/*/debug/gn_out 2>/dev/null || true

      # Build BOTH variants so downstream consumers can pick either:
      #  - plain "release" (no extra features)
      #  - "simdutf release" (needed by deno_core 2.9+, which unconditionally
      #    calls v8::simdutf::validate_ascii() so v8 must be compiled with
      #    the simdutf cargo feature). Publishing both variants avoids
      #    forcing every downstream to set V8_FROM_SOURCE=1.

      - name: Build V8 static library (plain release)
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          cargo build --release --locked --target ${{ matrix.config.target }}

      - name: Prepare plain release artifacts
        shell: bash
        run: |
          LIB_FILE="target/${{ matrix.config.target }}/release/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }}"
          OUT_GZ="target/${{ env.LIB_NAME }}_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz"
          SRC_BINDING="target/${{ matrix.config.target }}/release/gn_out/src_binding.rs"
          OUT_BINDING="target/src_binding_release_${{ matrix.config.target }}.rs"

          gzip -9c "$LIB_FILE" > "$OUT_GZ"
          cp "$SRC_BINDING" "$OUT_BINDING"

          ls -lh "$OUT_GZ" "$OUT_BINDING"

      - name: Build V8 static library (simdutf release)
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: |
          # Clear gn_out so build.rs regenerates GN args with rusty_v8_enable_simdutf=true.
          # (target/release/build/v8-*/ is kept — sccache still speeds up the actual cc/cxx work.)
          rm -rf target/${{ matrix.config.target }}/release/gn_out
          cargo build --release --locked --features simdutf --target ${{ matrix.config.target }}

      - name: Prepare simdutf release artifacts
        shell: bash
        run: |
          LIB_FILE="target/${{ matrix.config.target }}/release/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }}"
          OUT_GZ="target/${{ env.LIB_NAME }}_simdutf_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz"
          SRC_BINDING="target/${{ matrix.config.target }}/release/gn_out/src_binding.rs"
          OUT_BINDING="target/src_binding_simdutf_release_${{ matrix.config.target }}.rs"

          gzip -9c "$LIB_FILE" > "$OUT_GZ"
          cp "$SRC_BINDING" "$OUT_BINDING"

          ls -lh "$OUT_GZ" "$OUT_BINDING"

      - name: Publish release assets
        uses: softprops/action-gh-release@v0.1.15
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            target/${{ env.LIB_NAME }}_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
            target/src_binding_release_${{ matrix.config.target }}.rs
            target/${{ env.LIB_NAME }}_simdutf_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
            target/src_binding_simdutf_release_${{ matrix.config.target }}.rs
