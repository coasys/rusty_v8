# Coasys fork release workflow for rusty_v8.
# Builds the V8 static library for all supported platforms and publishes
# them as GitHub release assets so that downstream consumers (e.g. ad4m)
# can download pre-built binaries instead of building V8 from source.
#
# Triggered by pushing a tag of the form: v<version>
# The tag MUST match the `version` field in Cargo.toml so that
# rusty_v8's build.rs can locate the correct release for download.
# e.g.:  git tag v137.1.0 && git push origin v137.1.0

name: coasys-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.config.target }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 300

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true

          - os: macos-14
            target: aarch64-apple-darwin

          - os: macos-14
            target: x86_64-apple-darwin

          - os: windows-2022
            target: x86_64-pc-windows-msvc

    env:
      V8_FROM_SOURCE: true
      LIB_NAME: ${{ contains(matrix.config.target, 'windows') && 'rusty_v8' || 'librusty_v8' }}
      LIB_EXT: ${{ contains(matrix.config.target, 'windows') && 'lib' || 'a' }}

    steps:
      - name: Configure git
        run: git config --global core.symlinks true

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Install Rust toolchain
        uses: dsherret/rust-toolchain-file@v1

      - name: Add cross-compile target (macOS x86_64 on ARM runner)
        if: matrix.config.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.x

      - name: Install cross-compilation toolchain (aarch64-linux)
        if: matrix.config.cross == true
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt update
          sudo apt install -yq --no-install-suggests --no-install-recommends \
            binfmt-support g++-10-aarch64-linux-gnu g++-10-multilib \
            gcc-10-aarch64-linux-gnu libc6-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=/usr/bin/aarch64-linux-gnu-gcc-10" >> "${GITHUB_ENV}"

      - name: Install Clang (Linux)
        if: startsWith(matrix.config.os, 'ubuntu')
        run: |
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" | sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-jammy-19.list
          curl https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          sudo apt-get -qq remove 'clang-*'
          sudo apt-get install lld-19 clang-19 clang-tools-19 -y
          echo "CLANG_BASE_PATH=/usr/lib/llvm-19" >> "${GITHUB_ENV}"

      - name: Write git_submodule_status.txt
        run: git submodule status --recursive > git_submodule_status.txt

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |-
            target/sccache
            target/*/.*
            target/*/build
            target/*/deps
          key: coasys-release-${{ matrix.config.target }}-${{ hashFiles('Cargo.lock', 'build.rs', 'git_submodule_status.txt') }}
          restore-keys: coasys-release-${{ matrix.config.target }}-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4
        env:
          SCCACHE_CACHE_SIZE: 256M

      - name: Build V8 static library
        env:
          SCCACHE_IDLE_TIMEOUT: 0
        run: cargo build --release --locked --target ${{ matrix.config.target }}

      - name: Prepare release artifacts
        shell: bash
        run: |
          LIB_FILE="target/${{ matrix.config.target }}/release/gn_out/obj/${{ env.LIB_NAME }}.${{ env.LIB_EXT }}"
          OUT_GZ="target/${{ env.LIB_NAME }}_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz"
          SRC_BINDING="target/${{ matrix.config.target }}/release/gn_out/src_binding.rs"
          OUT_BINDING="target/src_binding_release_${{ matrix.config.target }}.rs"

          gzip -9c "$LIB_FILE" > "$OUT_GZ"
          cp "$SRC_BINDING" "$OUT_BINDING"
          ls -lh "$OUT_GZ" "$OUT_BINDING"

      - name: Publish release assets
        uses: softprops/action-gh-release@v0.1.15
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            target/${{ env.LIB_NAME }}_release_${{ matrix.config.target }}.${{ env.LIB_EXT }}.gz
            target/src_binding_release_${{ matrix.config.target }}.rs
